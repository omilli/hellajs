<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HellaJS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script type="importmap">
    {
      "imports": {
        "@hellajs/core": "../../packages/core/dist/bundle.min.js",
        "@hellajs/dom/": "../../packages/dom/dist/"
      }
    }
  </script>
</head>

<body>
  <div id="app"></div>
  <script type="module">
    import { signal } from "@hellajs/core";
    import { mount } from "@hellajs/dom/mount.min.js";
    import { html } from "@hellajs/dom/html.min.js";

    const counter = signal(0);

    mount(html`
      <h2>Counter: ${counter}</h2>
      <button class="btn btn-primary" on:click=${() => counter(counter() + 1)}>
        Increment
      </button>
  `);
  </script>
</body>

</html>
